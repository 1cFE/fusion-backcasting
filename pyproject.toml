[project]
name = "onecent-fusion"
version = "0.1.0"
description = "Intuition pump for exploring fusion electricity at $0.01/kWh LCOE"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "costingfe @ git+https://github.com/1cFE/1costingfe.git@numpy-only",
]

[project.optional-dependencies]
local = ["uvicorn[standard]>=0.27.0"]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
]

